AWSTemplateFormatVersion: "2010-09-09"
Description: "standing up an ECS Express Mode setup"

# added the CPU and Mem parameter becaause by default express mode allocates 1vpc=1024cpu units
# the app was triggering n alarm due to insufficient CPU units [the default of 1024 seem to be set to alarm at 60% it seems]
# Becasue the  target tracking scaling policy was triggering alarm at startup because of the cpu being at above 60% before dropping to 54%
# increasing the CPU units to 2048 helps prevent this issue and clear the alarm.
# cpu increase will warrant a corresponding increase in memory allocation if needed.
# https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task_definition_parameters.html
Parameters:
  ClusterName:
    Type: String
    Default: retail-store-express
    Description: Name of the ECS cluster for Express Mode services.

  UiServiceName:
    Type: String
    Default: ui-express
    Description: Name of the ECS Express Mode service.

  CatalogServiceName:
    Type: String
    Default: catalog-express
    Description: Name of the ECS Express Mode catalog service.

  CartServiceName:
    Type: String
    Default: cart-express
    Description: Name of the ECS Express Mode cart service.

  OrderServiceName:
    Type: String
    Default: order-express
    Description: Name of the ECS Express Mode order service.

  CheckoutServiceName:
    Type: String
    Default: checkout-express
    Description: Name of the ECS Express Mode checkout service.

  UiContainerImage:
    Type: String
    Default: public.ecr.aws/aws-containers/retail-store-sample-ui:1.5.0
    Description: Container image for the retail store UI.

  CatalogContainerImage:
    Type: String
    Default: public.ecr.aws/aws-containers/retail-store-sample-catalog:1.5.0
    Description: Container image for the retail store catalog service.

  CartContainerImage:
    Type: String
    Default: public.ecr.aws/aws-containers/retail-store-sample-cart:1.5.0
    Description: Container image for the retail store cart service.

  OrderContainerImage:
    Type: String
    Default: public.ecr.aws/aws-containers/retail-store-sample-orders:1.5.0
    Description: Container image for the retail store order service.

  CheckoutContainerImage:
    Type: String
    Default: public.ecr.aws/aws-containers/retail-store-sample-checkout:1.5.0
    Description: Container image for the retail store checkout service.

  UiContainerPort:
    Type: Number
    Default: 8080
    Description: Port the application listens on.

  CatalogContainerPort:
    Type: Number
    Default: 8080
    Description: Port the application listens on.

  CartContainerPort:
    Type: Number
    Default: 8080
    Description: Port the application listens on.

  OrderContainerPort:
    Type: Number
    Default: 8080
    Description: Port the application listens on.

  CheckoutContainerPort:
    Type: Number
    Default: 8080
    Description: Port the application listens on.

  UiHealthCheckPath:
    Type: String
    Default: /actuator/health
    Description: Health check path exposed by the application. 

  CatalogHealthCheckPath:
    Type: String
    Default: /health
    Description: Health check path exposed by the application. 


  CartHealthCheckPath:
    Type: String
    Default: /actuator/health
    Description: Health check path exposed by the application. 

  OrderHealthCheckPath:
    Type: String
    Default: /actuator/health
    Description: Health check path exposed by the application. 

  CheckoutHealthCheckPath:
    Type: String
    Default: /health
    Description: Health check path exposed by the application. 

  Cpu:
    Type: String
    Default: 2048
    Description: CPU units for the ECS task.

  Mem:
    Type: String
    Default: 4096
    Description: Memory units for the ECS task.

  UiTheme:
    Type: String
    Default: orange
    Description: Theme applied to the retail store UI (RETAIL_UI_THEME).

### Express Mode creates two Application Load Balancers in this setup: an internet-facing ALB for the UI (public subnets) and an internal ALB for the backend services (private subnets).
### Each ALB can host up to 25 services, routing traffic using host-header rules. Express Mode manages the full lifecycle of these ALBs: it provisions additional ones as needed and decommissions them when services are removed. 
### This reduces infrastructure costs compared to a dedicated ALB per service.
### Each ALB listenerrule routes traffic based on the host header matching the service's unique URL (*.ecs.<region>.on.aws). 
### You'll also notice each rule has two target groups (100% and 0%). This is the canary deployment mechanism. 
### During an update, traffic is gradually shifted from the old target group to the new one.

# -------------------------------------------------------------------------
# Infrastructure Role (REQUIRED)
# Allows ECS Express Mode to provision/manage load balancers, security
# groups, SSL certificates, and auto scaling on your behalf.
# -------------------------------------------------------------------------
Resources:

  CustomKMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: retail store ecs CMK
      EnableKeyRotation: true
      KeyPolicy:
        Statement:
          - Action: kms:*
            Effect: Allow
            Principal:
              AWS: !Join
                - ''
                - - 'arn:'
                  - !Ref AWS::Partition
                  - ':iam::'
                  - !Ref AWS::AccountId
                  - ':root'
            Resource: '*'
          - Action:
              - kms:CreateGrant
              - kms:Decrypt
              - kms:DescribeKey
              - kms:Encrypt
              - kms:GenerateDataKey*
              - kms:ReEncrypt*
            Condition:
              StringEquals:
                kms:ViaService: !Join
                  - ''
                  - - secretsmanager.
                    - !Ref AWS::Region
                    - .amazonaws.com
            Effect: Allow
            Principal:
              AWS: !Join
                - ''
                - - 'arn:'
                  - !Ref AWS::Partition
                  - ':iam::'
                  - !Ref AWS::AccountId
                  - ':root'
            Resource: '*'
        Version: '2012-10-17'
      PendingWindowInDays: 7
      Tags:
        - Key: Name
          Value: RetailStoreCustomKMSKey
    UpdateReplacePolicy: Delete
    DeletionPolicy: Delete

  CustomKMSKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/retail-store-ecs-cmk
      TargetKeyId: !GetAtt CustomKMSKey.Arn
  
  EcsExpressInfrastructureRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ecsExpressInfrastructureRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowAccessToECSForInfrastructureManagement
            Effect: Allow
            Principal:
              Service: ecs.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSInfrastructureRoleforExpressGatewayServices
      Tags:
        - Key: Name
          Value: ecsExpressInfrastructureRole       

# -------------------------------------------------------------------------
# Task Execution Role (REQUIRED)
# Allows the ECS agent to pull container images (ECR) and push container
# logs to CloudWatch Logs.
# -------------------------------------------------------------------------        
  RetailStoreEcsTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: retailStoreEcsTaskExecutionRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Tags:
        - Key: Name
          Value: retailStoreEcsTaskExecutionRole

  EcsExpressTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ecsExpressTaskRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ecsExpressTaskFireLensLogging
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AllowFireLensCloudWatchLogging
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                  - logs:PutRetentionPolicy
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/express-mode/*
              - Sid: SessionIntoEcsExpressUiTask
                Effect: Allow
                Action:
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                Resource: '*'                
      Tags:
        - Key: Name
          Value: ecsExpressTaskRole

  # ---------------------------------------------------------------------
  # ECS cluster hosting the Express service.
  # ---------------------------------------------------------------------
  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref ClusterName
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  # ---------------------------------------------------------------------
  # UI ECS Express Mode service. Express Mode auto-provisions the ALB with
  # HTTPS, target groups, security groups, auto scaling, and logging.
  # ---------------------------------------------------------------------
  UiExpressService:
    Type: AWS::ECS::ExpressGatewayService
    Properties:
      ServiceName: !Ref UiServiceName
      Cpu: !Ref Cpu
      Memory: !Ref Mem
      Cluster: !Ref EcsCluster
      ExecutionRoleArn: !GetAtt RetailStoreEcsTaskExecutionRole.Arn
      InfrastructureRoleArn: !GetAtt EcsExpressInfrastructureRole.Arn
      TaskRoleArn: !GetAtt EcsExpressTaskRole.Arn
      HealthCheckPath: !Ref UiHealthCheckPath
      PrimaryContainer:
        Image: !Ref UiContainerImage
        ContainerPort: !Ref UiContainerPort
        Environment:
          - Name: RETAIL_UI_THEME
            Value: !Ref UiTheme        
          - Name: RETAIL_UI_ENDPOINTS_CATALOG
            Value: !Sub "https://${CatalogExpressService.Endpoint}"        
          - Name: RETAIL_UI_ENDPOINTS_CARTS
            Value: !Sub "https://${CartExpressService.Endpoint}"        
          - Name: RETAIL_UI_ENDPOINTS_CHECKOUT
            Value: !Sub "https://${CheckoutExpressService.Endpoint}"        
          - Name: RETAIL_UI_ENDPOINTS_ORDERS
            Value: !Sub "https://${OrdersExpressService.Endpoint}"       
      NetworkConfiguration:
        Subnets:
          - !ImportValue VpcAPublicSubnetAZ1
          - !ImportValue VpcAPublicSubnetAZ2
      Tags:
        - Key: Name
          Value: !Ref UiServiceName

# ---------------------------------------------------------------------
## ECS Express Mode service. Express Mode auto-provisions an internal the ALB by passing private subnets to it.
## This is useful for internal services that do not need to be exposed to the public internet.
## Note that the internal ALB will not be accessible from the public internet.
## The internal ALB will still have HTTPS, target groups, security groups, auto scaling, and logging configured.
## It can have up 25 services attached to the internal ALB.
## The ORDER, CART, CATALOG, AND CHECKOUT INTERNAL SERVICES ARE ATTACHED TO THE INTERNAL ALB.
## Note that these services will not be accessible from the public internet.
# ---------------------------------------------------------------------
##


# ---------------------------------------------------------------------
# CATALOG ECS Express Mode service. Express Mode auto-provisions the ALB with
# HTTPS, target groups, security groups, auto scaling, and logging.
# ---------------------------------------------------------------------
  CatalogEcsExpressTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: catalogEcsTaskRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CatalogEcsExpressTaskRolePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CloudWatchLogging
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                  - logs:PutRetentionPolicy
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/express/*            
              - Sid: SessionIntoEcsExpressCatalogTask
                Effect: Allow
                Action:
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                Resource: '*'
      Tags:
        - Key: Name
          Value: catalogEcsTaskRole

  CatalogEcsTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: catalogEcsTaskExecutionRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: CatalogEcsTaskExecutionRolePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - secretsmanager:GetSecretValue
                  - ssm:GetParameters
                Resource: 
                  - !GetAtt CustomKMSKey.Arn
                  - !Join
                    - ''
                    - - 'arn:'
                      - !Ref AWS::Partition
                      - ':ssm:'
                      - !Ref AWS::Region
                      - ':'
                      - !Ref AWS::AccountId
                      - ':parameter'
                      - !Ref CatalogMySQLDBEndpointParameter
                  - !Ref CatalogDBCredentialsSecret
      Tags:
        - Key: Name
          Value: catalogEcsTaskExecutionRole

  CatalogDBCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      GenerateSecretString:
        ExcludePunctuation: true
        GenerateStringKey: password
        IncludeSpace: false
        PasswordLength: 10
        SecretStringTemplate: '{"username":"root"}'
      KmsKeyId: !GetAtt CustomKMSKey.Arn
      Name: retail-store-ecs-catalog-db
      Tags:
        - Key: Name
          Value: retail-store-ecs-catalog-db
    UpdateReplacePolicy: Delete
    DeletionPolicy: Delete

  CatalogMySQLDBEndpointParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /retail-store-ecs/catalog/db-endpoint-mysql
      Tags:
        CreationDate: '2026-09-04'
        Version: 1.0.14
        WorkshopName: ECSImmersionDay
      Type: String
      Value: !Join
        - ':'
        - - !GetAtt CatalogMySqlDBCluster.Endpoint.Address
          - !GetAtt CatalogMySqlDBCluster.Endpoint.Port

  CatalogMySqlDBCluster:
    Type: AWS::RDS::DBCluster
    Properties:
      CopyTagsToSnapshot: true
      DBClusterIdentifier: retail-store-ecs-catalog
      DBClusterParameterGroupName: !Ref CatalogDBClusterParams
      DBSubnetGroupName: !Ref CatalogDBClusterSubnets
      DatabaseName: catalog
      DeletionProtection: false
      Engine: aurora-mysql
      EngineVersion: 8.4.mysql_aurora.8.4.7
      MasterUserPassword: !Join
        - ''
        - - '{{resolve:secretsmanager:'
          - !Ref CatalogDBCredentialsSecret
          - ':SecretString:password::}}'
      MasterUsername: !Join
        - ''
        - - '{{resolve:secretsmanager:'
          - !Ref CatalogDBCredentialsSecret
          - ':SecretString:username::}}'
      ServerlessV2ScalingConfiguration:
        MaxCapacity: 2
        MinCapacity: 0.5
      StorageEncrypted: true
      Tags:
        - Key: Name
          Value: catalog
      VpcSecurityGroupIds:
        - !GetAtt CatalogRDSSecurityGroup.GroupId
    UpdateReplacePolicy: Delete
    DeletionPolicy: Delete

  CatalogDBCredentialsSecretAttachment:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Properties:
      SecretId: !Ref CatalogDBCredentialsSecret
      TargetId: !Ref CatalogMySqlDBCluster
      TargetType: AWS::RDS::DBCluster

  CatalogClusterMySqlInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBClusterIdentifier: !Ref CatalogMySqlDBCluster
      ## Workshop uses aurora serverless but Pluralsight SCP prevents using db.serverless class directly
      # DBInstanceClass: db.serverless
      DBInstanceClass: db.t4g.medium
      Engine: aurora-mysql
      PromotionTier: 0
      PubliclyAccessible: false
      Tags:
        - Key: Name
          Value: 'mysql-retail-store-ecs-catalog'
        - Key: environment-name
          Value: retail-store-ecs
    UpdateReplacePolicy: Delete
    DeletionPolicy: Delete
   
  CatalogRDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Catalog RDS instance
      GroupName: retail-store-ecs-catalog-rds
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic by default
          IpProtocol: '-1'
      SecurityGroupIngress:
        - Description: Allow MySQL access
          FromPort: 3306
          IpProtocol: tcp
          SourceSecurityGroupId: !GetAtt CatalogSecurityGroupIngress.GroupId
          ToPort: 3306
      Tags:
        - Key: Name
          Value: retail-store-ecs-catalog--mysqlrds-sg
      VpcId: !ImportValue VpcAId

# use this SG when you create a VPC cloudshell environment 
# using your custom vpc and a private subnet
  CatalogSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security Group for ECS Catalog Task
      GroupName: retail-store-ecs-catalog-task
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic by default
          IpProtocol: '-1'
      SecurityGroupIngress:
        - CidrIp: 0.0.0.0/0 #can tighten to vpc cidr for better security
          Description: Allow inbound 8080 traffic
          FromPort: 8080
          IpProtocol: tcp
          ToPort: 8080
      Tags:
        - Key: Name
          Value: retail-store-ecs-catalog-task-sg
      VpcId: !ImportValue VpcAId

  CatalogDBClusterParams:
    Type: AWS::RDS::DBClusterParameterGroup
    Properties:
      Description: Cluster parameter group for aurora-mysql8.4
      Family: aurora-mysql8.4
      Parameters:
        require_secure_transport: 'OFF'
      Tags:
        - Key: Name
          Value: catalog-mysqlrds-parameter-group

  CatalogDBClusterSubnets:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets for CatalogCluster database
      SubnetIds:
        - !ImportValue VpcAPrivateSubnetAZ1
        - !ImportValue VpcAPrivateSubnetAZ2
        - !ImportValue VpcAPrivateSubnetAZ3
      Tags:
        - Key: Name
          Value: catalog-mysqlrds-subnet-group

  CatalogExpressService:
    Type: AWS::ECS::ExpressGatewayService
    DependsOn: 
      - CatalogMySQLDBEndpointParameter
      - CatalogDBCredentialsSecret
      - CatalogMySqlDBCluster    
      - CatalogClusterMySqlInstance
    Properties:
      ServiceName: !Ref CatalogServiceName
      Cpu: !Ref Cpu
      Memory: !Ref Mem
      Cluster: !Ref EcsCluster
      ExecutionRoleArn: !GetAtt CatalogEcsTaskExecutionRole.Arn
      InfrastructureRoleArn: !GetAtt EcsExpressInfrastructureRole.Arn
      TaskRoleArn: !GetAtt CatalogEcsExpressTaskRole.Arn
      HealthCheckPath: !Ref CatalogHealthCheckPath
      PrimaryContainer:
        Image: !Ref CatalogContainerImage
        ContainerPort: !Ref CatalogContainerPort
        Environment:
          - Name: RETAIL_CATALOG_PERSISTENCE_DB_NAME
            Value: "catalog"        
          - Name: RETAIL_CATALOG_PERSISTENCE_PROVIDER
            Value: "mysql"
        Secrets:
          - Name: RETAIL_CATALOG_PERSISTENCE_ENDPOINT
            ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/retail-store-ecs/catalog/db-endpoint-mysql"
          - Name: RETAIL_CATALOG_PERSISTENCE_PASSWORD
            ValueFrom: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:retail-store-ecs-catalog-db:password::"
          - Name: RETAIL_CATALOG_PERSISTENCE_USER
            ValueFrom: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:retail-store-ecs-catalog-db:username::"  
      NetworkConfiguration:
        Subnets:
          - !ImportValue VpcAPrivateSubnetAZ1
          - !ImportValue VpcAPrivateSubnetAZ2
        # SG bcs it is an internal service via an internal ALB
        SecurityGroups:
          - !Ref CatalogSecurityGroupIngress
      Tags:
        - Key: Name
          Value: !Ref CatalogServiceName

# ---------------------------------------------------------------------
# CART ECS Express Mode service. Express Mode auto-provisions the ALB with
# HTTPS, target groups, security groups, auto scaling, and logging.
# ---------------------------------------------------------------------

  CartsSecurityDynamoDBTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: customerId
          AttributeType: S
      BillingMode: PAY_PER_REQUEST
      GlobalSecondaryIndexes:
        - IndexName: idx_global_customerId
          KeySchema:
            - AttributeName: customerId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      TableName: retail-store-ecs-carts
      Tags:
        - Key: Name
          Value: retail-store-ecs-carts
    UpdateReplacePolicy: Delete
    DeletionPolicy: Delete

  CartEcsExpressTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cartEcsExpressTaskRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DynamoDBEcsExpressCartTask
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: DynamoDBEcsExpressCartTask
                Effect: Allow
                Action:
                  - dynamodb:*
                Resource:
                  - arn:aws:dynamodb:*:*:table/retail-store-ecs-carts
                  - arn:aws:dynamodb:*:*:table/retail-store-ecs-carts/index/* 
              - Sid: CloudWatchLogging
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                  - logs:PutRetentionPolicy
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/express/*                  
              - Sid: SessionIntoEcsExpressCartTask
                Effect: Allow
                Action:
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                Resource: '*'
      Tags:
        - Key: Name
          Value: cartEcsExpressTaskRole

  CartExpressService:
    Type: AWS::ECS::ExpressGatewayService
    DependsOn: CartsSecurityDynamoDBTable
    Properties:
      ServiceName: !Ref CartServiceName
      Cpu: !Ref Cpu
      Memory: !Ref Mem
      Cluster: !Ref EcsCluster
      ExecutionRoleArn: !GetAtt RetailStoreEcsTaskExecutionRole.Arn
      InfrastructureRoleArn: !GetAtt EcsExpressInfrastructureRole.Arn
      TaskRoleArn: !GetAtt CartEcsExpressTaskRole.Arn
      HealthCheckPath: !Ref CartHealthCheckPath
      PrimaryContainer:
        Image: !Ref CartContainerImage
        ContainerPort: !Ref CartContainerPort
        Environment:
          - Name: RETAIL_CART_PERSISTENCE_PROVIDER
            Value: "dynamodb"        
          - Name: RETAIL_CART_PERSISTENCE_DYNAMODB_TABLE_NAME
            Value: "retail-store-ecs-carts"       
          - Name: RETAIL_CART_PERSISTENCE_DYNAMODB_CREATE_TABLE
            Value: "false"        
      NetworkConfiguration:
        Subnets:
          - !ImportValue VpcAPublicSubnetAZ1
          - !ImportValue VpcAPublicSubnetAZ2
      Tags:
        - Key: Name
          Value: !Ref CartServiceName

# ---------------------------------------------------------------------
# ORDER ECS Express Mode service. Express Mode auto-provisions the ALB with
# HTTPS, target groups, security groups, auto scaling, and logging.
# ---------------------------------------------------------------------

  OrderEcsExpressTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: orderEcsExpressTaskRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ecsExpressTaskFireLensLogging
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CloudWatchLogging
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                  - logs:PutRetentionPolicy
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/express/*
              - Sid: SessionIntoEcsExpressOrderTask
                Effect: Allow
                Action:
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                Resource: '*'                
      Tags:
        - Key: Name
          Value: orderEcsExpressTaskRole

  OrderEcsTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ordersEcsTaskExecutionRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: OrdersServiceParameterPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Action:
                  - kms:Decrypt
                  - secretsmanager:GetSecretValue
                  - ssm:GetParameters
                Effect: Allow
                Resource:
                  - !GetAtt CustomKMSKey.Arn
                  - !Join
                    - ''
                    - - 'arn:'
                      - !Ref AWS::Partition
                      - ':ssm:'
                      - !Ref AWS::Region
                      - ':'
                      - !Ref AWS::AccountId
                      - ':parameter'
                      - !Ref OrderServiceDBEndpointParameter
                  - !Ref OrderServiceDBCredentialsSecret
      Tags:
        - Key: Name
          Value: ordersEcsTaskExecutionRole

  OrdersIngressSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security Group for ECS Orders Task
      GroupName: retail-store-ecs-orders-task
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic by default
          IpProtocol: '-1'
      SecurityGroupIngress:
        - CidrIp: 0.0.0.0/0
          Description: Allow inbound 8080 traffic
          FromPort: 8080
          IpProtocol: tcp
          ToPort: 8080
      Tags:
        - Key: Name
          Value: retail-store-ecs-orders-task
      VpcId: !ImportValue VpcAId

  OrdersPostgresRdsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Orders RDS instance
      GroupName: retail-store-ecs-orders-rds
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic by default
          IpProtocol: '-1'
      SecurityGroupIngress:
        - Description: Allow PostgreSQL access
          FromPort: 5432
          IpProtocol: tcp
          SourceSecurityGroupId: !GetAtt OrdersIngressSecurityGroup.GroupId
          ToPort: 5432
      Tags:
        - Key: Name
          Value: retail-store-ecs-orders-rds-sg
      VpcId: !ImportValue VpcAId

  OrderServiceDBEndpointParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /retail-store-ecs/orders/db-endpoint-postgres
      Tags:
        CreationDate: '2026-09-04'
        Version: 1.0.14
        WorkshopName: ECSImmersionDay
      Type: String
      Value: !Join
        - ':'
        - - !GetAtt OrdersServicePostgresRDSCluster.Endpoint.Address
          - !GetAtt OrdersServicePostgresRDSCluster.Endpoint.Port

  OrderServiceDBCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      GenerateSecretString:
        ExcludePunctuation: true
        GenerateStringKey: password
        IncludeSpace: false
        PasswordLength: 10
        SecretStringTemplate: '{"username":"postgres"}'
      KmsKeyId: !GetAtt CustomKMSKey.Arn
      Name: retail-store-ecs-orders-db
      Tags:
        - Key: Name
          Value: retail-store-ecs-orders-db
    UpdateReplacePolicy: Delete
    DeletionPolicy: Delete

  OrderServiceDBCredentialsSecretAttachment:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Properties:
      SecretId: !Ref OrderServiceDBCredentialsSecret
      TargetId: !Ref OrdersServicePostgresRDSCluster
      TargetType: AWS::RDS::DBCluster

  OrdersServicePostgresRDSCluster:
    Type: AWS::RDS::DBCluster
    Properties:
      CopyTagsToSnapshot: true
      DBClusterIdentifier: retail-store-ecs-orders
      DBClusterParameterGroupName: default.aurora-postgresql17
      DBSubnetGroupName: !Ref OrdersPostgresDbClusterSubnets
      DatabaseName: orders
      DeletionProtection: false
      Engine: aurora-postgresql
      EngineVersion: '17.9'
      MasterUserPassword: !Join
        - ''
        - - '{{resolve:secretsmanager:'
          - !Ref OrderServiceDBCredentialsSecret
          - ':SecretString:password::}}'
      MasterUsername: !Join
        - ''
        - - '{{resolve:secretsmanager:'
          - !Ref OrderServiceDBCredentialsSecret
          - ':SecretString:username::}}'
      Port: 5432
      ServerlessV2ScalingConfiguration:
        MaxCapacity: 2
        MinCapacity: 0.5
      StorageEncrypted: true
      Tags:
        - Key: Name
          Value: retail-store-ecs-orders
      VpcSecurityGroupIds:
        - !GetAtt OrdersPostgresRdsSecurityGroup.GroupId
    UpdateReplacePolicy: Delete
    DeletionPolicy: Delete

  OrdersPostgresDbClusterSubnets:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets for OrdersCluster Postgres database
      SubnetIds:
        - !ImportValue VpcAPrivateSubnetAZ1
        - !ImportValue VpcAPrivateSubnetAZ2
        - !ImportValue VpcAPrivateSubnetAZ3
      Tags:
        - Key: Name
          Value: retail-store-ecs-orders-subnets

  OrdersClusterRDSInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBClusterIdentifier: !Ref OrdersServicePostgresRDSCluster
      ## Workshop uses aurora serverless but Pluralsight SCP prevents using db.serverless class directly
      # DBInstanceClass: db.serverless
      DBInstanceClass: db.t4g.medium
      Engine: aurora-postgresql
      PromotionTier: 0
      PubliclyAccessible: false
      Tags:
        - Key: environment-name
          Value: retail-store-ecs
        - Key: Name
          Value: 'postgres-retail-store-ecs-orders'
    UpdateReplacePolicy: Delete
    DeletionPolicy: Delete

  OrdersExpressService:
    Type: AWS::ECS::ExpressGatewayService
    DependsOn: 
      - OrderServiceDBEndpointParameter
      - OrderServiceDBCredentialsSecret
      - OrdersServicePostgresRDSCluster    
      - OrdersClusterRDSInstance
    Properties:
      ServiceName: !Ref OrderServiceName
      Cpu: !Ref Cpu
      Memory: !Ref Mem
      Cluster: !Ref EcsCluster
      ExecutionRoleArn: !GetAtt OrderEcsTaskExecutionRole.Arn
      InfrastructureRoleArn: !GetAtt EcsExpressInfrastructureRole.Arn
      TaskRoleArn: !GetAtt OrderEcsExpressTaskRole.Arn
      HealthCheckPath: !Ref OrderHealthCheckPath
      PrimaryContainer:
        Image: !Ref OrderContainerImage
        ContainerPort: !Ref OrderContainerPort
        Environment:    
          - Name: RETAIL_ORDERS_PERSISTENCE_PROVIDER
            Value: "postgres"
        Secrets:
          - Name: RETAIL_ORDERS_PERSISTENCE_ENDPOINT
            ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/retail-store-ecs/orders/db-endpoint-postgres"
          - Name: RETAIL_ORDERS_PERSISTENCE_NAME
            ValueFrom: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:retail-store-ecs-orders-db:dbname::"
          - Name: RETAIL_ORDERS_PERSISTENCE_USERNAME
            ValueFrom: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:retail-store-ecs-orders-db:username::"
          - Name: RETAIL_ORDERS_PERSISTENCE_PASSWORD
            ValueFrom: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:retail-store-ecs-orders-db:password::"  
      NetworkConfiguration:
        Subnets:
          - !ImportValue VpcAPrivateSubnetAZ1
          - !ImportValue VpcAPrivateSubnetAZ2
        # SG bcs it is an internal service via an internal ALB
        SecurityGroups:
          - !Ref OrdersIngressSecurityGroup
      Tags:
        - Key: Name
          Value: !Ref OrderServiceName

# ---------------------------------------------------------------------
# CHECKOUT ECS Express Mode service. Express Mode auto-provisions the ALB with
# HTTPS, target groups, security groups, auto scaling, and logging.
# ---------------------------------------------------------------------

  CheckoutEcsExpressTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: checkoutEcsExpressTaskRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ecsExpressTaskFireLensLogging
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CloudWatchLogging
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                  - logs:PutRetentionPolicy
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/express/*
              - Sid: SessionIntoEcsExpressOrderTask
                Effect: Allow
                Action:
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                Resource: '*'                
      Tags:
        - Key: Name
          Value: orderEcsExpressTaskRole

  CheckoutEcsTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: checkoutEcsTaskExecutionRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: CheckoutServiceParameterPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Action:
                  - kms:Decrypt
                  - ssm:GetParameters
                Effect: Allow
                Resource:
                  - !GetAtt CustomKMSKey.Arn
                  - !Join
                    - ''
                    - - 'arn:'
                      - !Ref AWS::Partition
                      - ':ssm:'
                      - !Ref AWS::Region
                      - ':'
                      - !Ref AWS::AccountId
                      - ':parameter'
                      - !Ref CheckoutRedisEndpointParameter
      Tags:
        - Key: Name
          Value: checkoutEcsTaskExecutionRole

  CheckoutRedisEndpointParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /retail-store-ecs/checkout/redis-endpoint
      Tags:
        CreationDate: '2026-09-04'
        Version: 1.0.14
        WorkshopName: ECSImmersionDay
      Type: String
      Value: !Join
        - ''
        - - rediss://
          - !Join
            - ':'
            - - !GetAtt CheckoutRedisCluster.Endpoint.Address
              - !GetAtt CheckoutRedisCluster.Endpoint.Port
 
  CheckoutRedisCluster:
    Type: AWS::ElastiCache::ServerlessCache
    Properties:
      Description: Redis cluster for checkout service
      Engine: redis
      SecurityGroupIds:
        - !GetAtt CheckoutRedisSecurityGroup.GroupId
      ServerlessCacheName: retail-store-ecs-redis
      SubnetIds:
        - !ImportValue VpcAPrivateSubnetAZ1
        - !ImportValue VpcAPrivateSubnetAZ2
        - !ImportValue VpcAPrivateSubnetAZ3
      Tags:
        - Key: Name
          Value: retail-store-ecs-redis
    DeletionPolicy: Delete

  CheckoutRedisSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Redis cluster
      GroupName: retail-store-ecs-redis
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic by default
          IpProtocol: '-1'
      SecurityGroupIngress:
        - Description: Allow Redis access
          FromPort: 6379
          IpProtocol: tcp
          SourceSecurityGroupId: !GetAtt CheckoutIngressSecurityGroup.GroupId
          ToPort: 6379
      Tags:
        - Key: Name
          Value: retail-store-ecs-redis
      VpcId: !ImportValue VpcAId

  CheckoutIngressSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security Group for ECS Checkout Task
      GroupName: retail-store-ecs-checkout-task
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic by default
          IpProtocol: '-1'
      SecurityGroupIngress:
        - CidrIp: 0.0.0.0/0
          Description: Allow inbound 8080 traffic
          FromPort: 8080
          IpProtocol: tcp
          ToPort: 8080
      Tags:
        - Key: Name
          Value: retail-store-ecs-checkout-task
      VpcId: !ImportValue VpcAId

  CheckoutExpressService:
    Type: AWS::ECS::ExpressGatewayService
    DependsOn: 
      - OrderServiceDBEndpointParameter
      - OrderServiceDBCredentialsSecret
      - OrdersServicePostgresRDSCluster    
      - OrdersClusterRDSInstance
    Properties:
      ServiceName: !Ref CheckoutServiceName
      Cpu: !Ref Cpu
      Memory: !Ref Mem
      Cluster: !Ref EcsCluster
      ExecutionRoleArn: !GetAtt CheckoutEcsTaskExecutionRole.Arn
      InfrastructureRoleArn: !GetAtt EcsExpressInfrastructureRole.Arn
      TaskRoleArn: !GetAtt CheckoutEcsExpressTaskRole.Arn
      HealthCheckPath: !Ref CheckoutHealthCheckPath
      PrimaryContainer:
        Image: !Ref CheckoutContainerImage
        ContainerPort: !Ref CheckoutContainerPort
        Environment:    
          - Name: RETAIL_CHECKOUT_ENDPOINTS_ORDERS
            Value: !Sub "https://${OrdersExpressService.Endpoint}"
          - Name: RETAIL_CHECKOUT_PERSISTENCE_PROVIDER
            Value: "redis"
        Secrets:
          - Name: RETAIL_CHECKOUT_PERSISTENCE_REDIS_URL
            ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/retail-store-ecs/checkout/redis-endpoint"
      NetworkConfiguration:
        Subnets:
          - !ImportValue VpcAPrivateSubnetAZ1
          - !ImportValue VpcAPrivateSubnetAZ2
        # SG bcs it is an internal service via an internal ALB
        SecurityGroups:
          - !Ref CheckoutIngressSecurityGroup
      Tags:
        - Key: Name
          Value: !Ref CheckoutServiceName


Outputs:
  ClusterName:
    Description: ECS cluster hosting the Express service.
    Value: !Ref EcsCluster   

  UiServiceEndpoint:
    Description: HTTPS endpoint of the Express Mode service.
    Value: !GetAtt UiExpressService.Endpoint

  UiServiceArn:
    Description: ARN of the Express Mode service.
    Value: !GetAtt UiExpressService.ServiceArn

  CatalogServiceEndpoint:
    Description: HTTPS endpoint of the Express Mode service.
    Value: !GetAtt CatalogExpressService.Endpoint

  CatalogServiceArn:
    Description: ARN of the Express Mode service.
    Value: !GetAtt CatalogExpressService.ServiceArn

  CartServiceEndpoint:
    Description: HTTPS endpoint of the Express Mode service.
    Value: !GetAtt CartExpressService.Endpoint

  CartServiceArn:
    Description: ARN of the Express Mode service.
    Value: !GetAtt CartExpressService.ServiceArn

  OrdersServiceEndpoint:
    Description: HTTPS endpoint of the Express Mode service.
    Value: !GetAtt OrdersExpressService.Endpoint

  OrdersServiceArn:
    Description: ARN of the Express Mode service.
    Value: !GetAtt OrdersExpressService.ServiceArn

  CheckoutServiceEndpoint:
    Description: HTTPS endpoint of the Express Mode service.
    Value: !GetAtt CheckoutExpressService.Endpoint

  CheckoutServiceArn:
    Description: ARN of the Express Mode service.
    Value: !GetAtt CheckoutExpressService.ServiceArn
