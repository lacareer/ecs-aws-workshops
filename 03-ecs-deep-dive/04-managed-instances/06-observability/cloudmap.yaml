AWSTemplateFormatVersion: "2010-09-09"
Description: ECS Managed Instances workshop - cluster, IAM roles, security group, and capacity provider.

Parameters:
  ClusterName:
    Type: String
    Default: retail-store-ecs-cluster
    Description: Name of the ECS cluster.

  CapacityProviderName:
    Type: String
    Default: retail-store-ecs-cluster-managed-instances-cp
    Description: Name of the managed instances capacity provider.

  CapacityProvider:
    Type: String
    Default: FARGATE_SPOT
    Description: Name of the capacity provider (e.g., FARGATE or FARGATE_SPOT).
    AllowedValues:
      - FARGATE
      - FARGATE_SPOT

  StorageSizeGiB:
    Type: Number
    Default: 100
    MinValue: 30
    MaxValue: 16384
    Description: EBS volume size for managed instances.

Resources:
  # Role AWS assumes to provision/manage the instances on your behalf
  EcsInfrastructureRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ecsManagedInstancesInfrastructureRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonECSInfrastructureRolePolicyForManagedInstances
      Policies:
        - PolicyName: passInstanceRole
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt EcsInstanceRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: ec2.amazonaws.com        

  # Role the EC2 managed instances themselves run with
  EcsInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ecsManagedInstancesInstanceRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  EcsInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: ecsManagedInstancesInstanceProfile
      Roles:
        - !Ref EcsInstanceRole

  # Public-facing ALB security group
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for the UI ALB.
      GroupName: retail-store-ui-alb-sg
      VpcId: !ImportValue VpcAId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  # Let the ALB reach UI task ENIs on 8080 (awsvpc → ip targets)
  UiManagedInstanceTaskSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for the ui-facing ECS Managed Instances tasks.
      GroupName: ui-retail-store-ecs-sg
      VpcId: !ImportValue VpcAId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: ui-retail-store-alb
      Scheme: internet-facing
      Subnets:
        - !ImportValue VpcAPublicSubnetAZ1
        - !ImportValue VpcAPublicSubnetAZ2
      SecurityGroups:
        - !Ref AlbSecurityGroup

  UiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: retail-store-ui-tg
      VpcId: !ImportValue VpcAId
      Port: 8080
      Protocol: HTTP
      TargetType: ip          # awsvpc tasks register as IP targets
      HealthCheckPath: /actuator/health
      HealthCheckProtocol: HTTP
      Matcher:
        HttpCode: "200"

  AlbListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref UiTargetGroup

  UiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: ui-retail-store-app-ecs
      RetentionInDays: 7

  # Lets the ECS agent pull images and write logs
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: retailStoreAppEcsTaskExecutionRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: allowWriteUiLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${UiLogGroup}:*"

  # Role the container assumes at runtime (empty for now; add app permissions as needed)
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: retailStoreAppEcsTaskRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: retailStoreEcsTaskFireLensLogging
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: TaskCloudWatchLogging
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                  - logs:PutRetentionPolicy
                Resource: 
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/${UiLogGroup}:*
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/${CatalogLogGroup}:*
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/${BackendLogGroup}:*
              - Sid: SessionIntoRetailStoreUiTask
                Effect: Allow
                Action:
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                Resource: '*'             

  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref ClusterName
      ClusterSettings:
        - Name: containerInsights
          Value: enhanced   # enhanced observability, as the workshop specifies

  ManagedInstancesCapacityProvider:
    Type: AWS::ECS::CapacityProvider
    Properties:
      Name: !Ref CapacityProviderName
      ClusterName: !Ref EcsCluster
      ManagedInstancesProvider:
        InfrastructureRoleArn: !GetAtt EcsInfrastructureRole.Arn
        InstanceLaunchTemplate:
          Ec2InstanceProfileArn: !GetAtt EcsInstanceProfile.Arn
          NetworkConfiguration:
            Subnets:
              - !ImportValue VpcAPrivateSubnetAZ1
              - !ImportValue VpcAPrivateSubnetAZ2
              - !ImportValue VpcAPrivateSubnetAZ3
            SecurityGroups:
              - !Ref UiManagedInstanceTaskSg
          StorageConfiguration:
            StorageSizeGiB: !Ref StorageSizeGiB
          Monitoring: DETAILED   # detailed = 1-min CloudWatch metrics, as the workshop uses

  UiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    DependsOn: UiLogGroup
    Properties:
      Family: retail-store-ecs-ui
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - MANAGED_INSTANCES
      Cpu: "1024"
      Memory: "2048"
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: application
          Image: public.ecr.aws/aws-containers/retail-store-sample-ui:1.2.3
          Essential: true
          PortMappings:
            - Name: application
              ContainerPort: 8080
              HostPort: 8080
              Protocol: tcp
              AppProtocol: http
          LinuxParameters:
            InitProcessEnabled: true
          HealthCheck:
            Command:
              - CMD-SHELL
              - curl -f http://localhost:8080/actuator/health || exit 1
            Interval: 10
            Timeout: 5
            Retries: 3
            StartPeriod: 60   
          Environment:
            - Name: RETAIL_UI_ENDPOINTS_CATALOG
              Value: http://catalog.retailstore.local:8080
            - Name: RETAIL_UI_ENDPOINTS_ORDERS
              Value: http://orders.retailstore.local:8080
            - Name: RETAIL_UI_ENDPOINTS_CHECKOUT
              Value: http://checkout.retailstore.local:8080
            - Name: RETAIL_UI_ENDPOINTS_CARTS
              Value: http://carts.retailstore.local:8080                    
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref UiLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ui-service

# #On UiService, removed the entire ServiceConnectConfiguration block (the UI isn't registered in DNS — it sits behind the ALB and only calls backends). 
  UiService:
    DependsOn: 
      - CatalogService
      - RetailStoreDnsNamespace
      - AlbListener
    Type: AWS::ECS::Service
    Properties:
      ServiceName: ui
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref UiTaskDefinition
      DesiredCount: 1
      EnableExecuteCommand: true 
      # CapacityProviderStrategy:
      #   - CapacityProvider: !Ref CapacityProviderName
      #     Weight: 1
      CapacityProviderStrategy:
        - CapacityProvider: !Ref ManagedInstancesCapacityProvider
          Weight: 1
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !ImportValue VpcAPrivateSubnetAZ1
            - !ImportValue VpcAPrivateSubnetAZ2
            - !ImportValue VpcAPrivateSubnetAZ3
          SecurityGroups:
            - !Ref UiManagedInstanceTaskSg
      LoadBalancers:
        - TargetGroupArn: !Ref UiTargetGroup
          ContainerName: application
          ContainerPort: 8080
      ServiceRegistries:
        - RegistryArn: !GetAtt UiDiscoveryService.Arn                   

  # Private DNS namespace for *.retailstore.local service discovery
  RetailStoreDnsNamespace:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Properties:
      Name: retailstore.local
      Vpc: !ImportValue VpcAId

  UiDiscoveryService:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: ui
      NamespaceId: !GetAtt RetailStoreDnsNamespace.Id
      DnsConfig:
        RoutingPolicy: MULTIVALUE        # multiple task IPs returned for awsvpc
        DnsRecords:
          - Type: A
            TTL: 60
      HealthCheckCustomConfig:
        FailureThreshold: 1

  CatalogDiscoveryService:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: catalog
      NamespaceId: !GetAtt RetailStoreDnsNamespace.Id
      DnsConfig:
        RoutingPolicy: MULTIVALUE        # multiple task IPs returned for awsvpc
        DnsRecords:
          - Type: A
            TTL: 60
      HealthCheckCustomConfig:
        FailureThreshold: 1

  OrdersDiscoveryService:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: orders
      NamespaceId: !GetAtt RetailStoreDnsNamespace.Id
      DnsConfig:
        RoutingPolicy: MULTIVALUE
        DnsRecords:
          - Type: A
            TTL: 60
      HealthCheckCustomConfig:
        FailureThreshold: 1

  CheckoutDiscoveryService:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: checkout
      NamespaceId: !GetAtt RetailStoreDnsNamespace.Id
      DnsConfig:
        RoutingPolicy: MULTIVALUE
        DnsRecords:
          - Type: A
            TTL: 60
      HealthCheckCustomConfig:
        FailureThreshold: 1

  CartsDiscoveryService:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: carts
      NamespaceId: !GetAtt RetailStoreDnsNamespace.Id
      DnsConfig:
        RoutingPolicy: MULTIVALUE
        DnsRecords:
          - Type: A
            TTL: 60
      HealthCheckCustomConfig:
        FailureThreshold: 1

  CatalogLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: catalog-retail-store-app-ecs
      RetentionInDays: 7
  
  # Allow the UI tasks to reach Catalog tasks on 8080
  CatalogTaskSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for the Catalog ECS Managed Instances tasks.
      GroupName: retail-store-ecs-catalog-task
      VpcId: !ImportValue VpcAId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref UiManagedInstanceTaskSg
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  CatalogTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    DependsOn: UiLogGroup
    Properties:
      Family: retail-store-catalog
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - MANAGED_INSTANCES
      Cpu: "512"
      Memory: "1024"
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: catalog
          Image: public.ecr.aws/aws-containers/retail-store-sample-catalog:1.2.3
          Essential: true
          PortMappings:
            - Name: application # must be the name used in the service connect configuration in the catalog service
              ContainerPort: 8080
              Protocol: tcp
              AppProtocol: http
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref CatalogLogGroup       
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: catalog

  CatalogService:
    DependsOn: RetailStoreDnsNamespace
    Type: AWS::ECS::Service
    Properties:
      ServiceName: catalog
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref CatalogTaskDefinition
      DesiredCount: 1
      EnableExecuteCommand: true 
      CapacityProviderStrategy:
        - CapacityProvider: !Ref ManagedInstancesCapacityProvider
          Weight: 1
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !ImportValue VpcAPrivateSubnetAZ1
            - !ImportValue VpcAPrivateSubnetAZ2
            - !ImportValue VpcAPrivateSubnetAZ3
          SecurityGroups:
            - !Ref CatalogTaskSg
      ServiceRegistries:
        - RegistryArn: !GetAtt CatalogDiscoveryService.Arn   

  # One log group for the new backend services (matches the workshop group name)
  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: retail-store-app-ecs
      RetentionInDays: 7

  # Backend tasks: reachable on 8080 from the UI and from each other (checkout -> orders)
  BackendTaskSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for orders/checkout/carts ECS tasks.
      GroupName: retail-store-ecs-backend-task
      VpcId: !ImportValue VpcAId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref UiManagedInstanceTaskSg
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  # Separate rule to allow backend-to-backend 8080 (avoids inline self-reference)
  BackendTaskSgSelfIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref BackendTaskSg
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !Ref BackendTaskSg

  OrdersTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    DependsOn: BackendLogGroup
    Properties:
      Family: retail-store-ecs-orders
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - MANAGED_INSTANCES
      Cpu: "1024"
      Memory: "2048"
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: application
          Image: public.ecr.aws/aws-containers/retail-store-sample-orders:1.2.3
          Essential: true
          PortMappings:
            - Name: application
              ContainerPort: 8080
              HostPort: 8080
              Protocol: tcp
              AppProtocol: http
          LinuxParameters:
            InitProcessEnabled: true
          Environment:
            - Name: RETAIL_ORDERS_PERSISTENCE_PROVIDER
              Value: in-memory
            - Name: RETAIL_ORDERS_MESSAGING_PROVIDER
              Value: in-memory
          HealthCheck:
            Command:
              - CMD-SHELL
              - curl -f http://localhost:8080/actuator/health || exit 1
            Interval: 10
            Timeout: 5
            Retries: 3
            StartPeriod: 60
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref BackendLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: orders-service

  OrdersService:
    Type: AWS::ECS::Service
    DependsOn: RetailStoreDnsNamespace
    Properties:
      ServiceName: orders
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref OrdersTaskDefinition
      DesiredCount: 1
      EnableExecuteCommand: true
      CapacityProviderStrategy:
        - CapacityProvider: !Ref ManagedInstancesCapacityProvider
          Weight: 1
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !ImportValue VpcAPrivateSubnetAZ1
            - !ImportValue VpcAPrivateSubnetAZ2
            - !ImportValue VpcAPrivateSubnetAZ3
          SecurityGroups:
            - !Ref BackendTaskSg
      ServiceRegistries:
        - RegistryArn: !GetAtt OrdersDiscoveryService.Arn

  CheckoutTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    DependsOn: BackendLogGroup
    Properties:
      Family: retail-store-ecs-checkout
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - MANAGED_INSTANCES
      Cpu: "1024"
      Memory: "2048"
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: application
          Image: public.ecr.aws/aws-containers/retail-store-sample-checkout:1.2.3
          Essential: true
          PortMappings:
            - Name: application
              ContainerPort: 8080
              HostPort: 8080
              Protocol: tcp
              AppProtocol: http
          LinuxParameters:
            InitProcessEnabled: true
          Environment:
            - Name: RETAIL_CHECKOUT_PERSISTENCE_PROVIDER
              Value: in-memory
            # - Name: RETAIL_CHECKOUT_ENDPOINTS_ORDERS
            #   Value: http://orders:8080           # Service Connect alias for orders
            ## update env to replect the privatednsname for the orders service
            ## the private DNS name follows the pattern: <service>.<namespace>.local
            - Name: RETAIL_CHECKOUT_ENDPOINTS_ORDERS
              Value: http://orders.retailstore.local:8080              
          HealthCheck:
            Command:
              - CMD-SHELL
              - curl -f http://localhost:8080/health || exit 1   # checkout uses /health, not /actuator/health
            Interval: 10
            Timeout: 5
            Retries: 3
            StartPeriod: 60
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref BackendLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: checkout-service

  CheckoutService:
    Type: AWS::ECS::Service
    DependsOn: RetailStoreDnsNamespace
    Properties:
      ServiceName: checkout
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref CheckoutTaskDefinition
      DesiredCount: 1
      EnableExecuteCommand: true
      CapacityProviderStrategy:
        - CapacityProvider: !Ref ManagedInstancesCapacityProvider
          Weight: 1
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !ImportValue VpcAPrivateSubnetAZ1
            - !ImportValue VpcAPrivateSubnetAZ2
            - !ImportValue VpcAPrivateSubnetAZ3
          SecurityGroups:
            - !Ref BackendTaskSg
      ServiceRegistries:
        - RegistryArn: !GetAtt CheckoutDiscoveryService.Arn


  CartsTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    DependsOn: BackendLogGroup
    Properties:
      Family: retail-store-ecs-carts
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - MANAGED_INSTANCES
      Cpu: "1024"
      Memory: "2048"
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: application
          Image: public.ecr.aws/aws-containers/retail-store-sample-cart:1.2.3
          Essential: true
          PortMappings:
            - Name: application
              ContainerPort: 8080
              HostPort: 8080
              Protocol: tcp
              AppProtocol: http
          LinuxParameters:
            InitProcessEnabled: true
          Environment:
            - Name: RETAIL_CART_PERSISTENCE_PROVIDER
              Value: in-memory            # carts defaults to DynamoDB; confirm in-memory is supported by your build
          HealthCheck:
            Command:
              - CMD-SHELL
              - curl -f http://localhost:8080/actuator/health || exit 1
            Interval: 10
            Timeout: 5
            Retries: 3
            StartPeriod: 60
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref BackendLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: carts-service

  CartsService:
    Type: AWS::ECS::Service
    DependsOn: RetailStoreDnsNamespace
    Properties:
      ServiceName: carts
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref CartsTaskDefinition
      DesiredCount: 1
      EnableExecuteCommand: true
      CapacityProviderStrategy:
        - CapacityProvider: !Ref ManagedInstancesCapacityProvider
          Weight: 1
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !ImportValue VpcAPrivateSubnetAZ1
            - !ImportValue VpcAPrivateSubnetAZ2
            - !ImportValue VpcAPrivateSubnetAZ3
          SecurityGroups:
            - !Ref BackendTaskSg
      ServiceRegistries:
        - RegistryArn: !GetAtt CartsDiscoveryService.Arn

Outputs:
  ClusterName:
    Value: !Ref EcsCluster
  ClusterArn:
    Value: !GetAtt EcsCluster.Arn
  CapacityProviderArn:
    Value: !Ref ManagedInstancesCapacityProvider
  InfrastructureRoleArn:
    Value: !GetAtt EcsInfrastructureRole.Arn
  InstanceProfileArn:
    Value: !GetAtt EcsInstanceProfile.Arn
  UiAlbUrl:
    Value: !Sub "http://${ApplicationLoadBalancer.DNSName}"    