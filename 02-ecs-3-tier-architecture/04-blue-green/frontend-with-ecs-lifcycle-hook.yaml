#----------------------------------------------------------------

  EcsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for the ui-facing ECS tasks.
      GroupName: retail-store-ecs-sg
      VpcId: !ImportValue VpcAId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  # To use Container Insights with enhanced observability, set the containerInsights account setting to enhanced.
  # To use Container Insights, set the containerInsights account setting to enabled.
  # PluralSight account setting for Container Insights is enabled
  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref ClusterName
      ClusterSettings:
        - Name: containerInsights
          Value: enabled # supported values are enhanced, enabled, and disabled

  UiLogConfiguration:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: retail-store-ecs-tasks-ui-service
      RetentionInDays: 7

  RetailStoreEcsTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: retailStoreEcsTaskExecutionRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: allowCreateTaskLogGroup
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${UiLogConfiguration}:*         
      Tags:
        - Key: Name
          Value: retailStoreEcsTaskExecutionRole

  RetailStoreEcsTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: retailStoreEcsTaskRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: retailStoreEcsTaskFireLensLogging
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AllowFireLensCloudWatchLogging
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                  - logs:PutRetentionPolicy
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/${UiLogConfiguration}:*
              - Sid: SessionIntoRetailStoreUiTask
                Effect: Allow
                Action:
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                Resource: '*'                
      Tags:
        - Key: Name
          Value: retailStoreEcsTaskRole

  UiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: retail-store-ecs-ui
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: !Ref Cpu
      Memory: !Ref Mem
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !Ref RetailStoreEcsTaskExecutionRole
      TaskRoleArn: !Ref RetailStoreEcsTaskRole
      ContainerDefinitions:
        - Name: application #same name as in the UiService LoadBalancers section
          Image: public.ecr.aws/aws-containers/retail-store-sample-ui:1.2.3
          Essential: true
          PortMappings:
            - Name: application
              ContainerPort: !Ref UiContainerPort
              HostPort: !Ref UiContainerPort
              Protocol: tcp
              AppProtocol: http
          LinuxParameters:
            InitProcessEnabled: true
          HealthCheck:
            Command:
              - CMD-SHELL
              - curl -f http://localhost:8080/actuator/health || exit 1
            Interval: 10
            Timeout: 5
            Retries: 3
            StartPeriod: 30
          VersionConsistency: disabled
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref UiLogConfiguration
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ui-service
              # awslogs-create-group: "true"
          Environment:
            - Name: RETAIL_UI_THEME
              Value: !Ref UiTheme            

  # modified ui service for blue/green deployment
  UiService:
    Type: AWS::ECS::Service
    # Service creation fails if the listener isn't attached to the target group yet
    DependsOn: 
      - ProductionListenerRule
      - TestListenerRule 
      - ManualApprovalFunction   
    Properties:
      ServiceName: !Ref UiServiceName
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref UiTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 30
      EnableExecuteCommand: true
      # modified uiservice configuration for blue/green deployment
      DeploymentConfiguration:
        Strategy: BLUE_GREEN
        BakeTimeInMinutes: 2
        ## I did not use nor test the configuration for the manual-approval Lambda.
        ## Hence, why ic ommented it out
        ## Optional manual-approval hook after test traffic shifts (see note below)
        LifecycleHooks:
          - HookTargetArn: !GetAtt ManualApprovalFunction.Arn
            RoleArn: !GetAtt ECSLifecycleHookRole.Arn
            LifecycleStages:
              - POST_TEST_TRAFFIC_SHIFT
      LoadBalancers:
        - TargetGroupArn: !Ref BlueTargetGroup
          ContainerName: application
          ContainerPort: !Ref UiContainerPort
          AdvancedConfiguration:
            AlternateTargetGroupArn: !Ref GreenTargetGroup
            ProductionListenerRule: !Ref ProductionListenerRule
            TestListenerRule: !Ref TestListenerRule
            RoleArn: !GetAtt EcsInfrastructureRole.Arn
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !ImportValue VpcAPrivateSubnetAZ1
            - !ImportValue VpcAPrivateSubnetAZ2
          SecurityGroups:
            - !Ref EcsSecurityGroup
      Tags:
        - Key: Name
          Value: !Ref UiServiceName

  ECSLifecycleHookRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ECSLifecycleHookRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeManualApprovalHook
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt ManualApprovalFunction.Arn        

  ManualApprovalLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/ecs-blue-green-manual-approval
      RetentionInDays: 7

  ManualApprovalFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ecsBlueGreenManualApprovalRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ManualApprovalPermissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${ManualApprovalLogGroup}:*"
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::${ApprovalBucketName}/${ApprovalObjectKey}"

  ManualApprovalFunction:
    Type: AWS::Lambda::Function
    DependsOn: ManualApprovalLogGroup
    Properties:
      FunctionName: ecs-blue-green-manual-approval
      Runtime: python3.13
      Architectures: [arm64]
      Handler: index.lambda_handler
      Timeout: 10
      Role: !GetAtt ManualApprovalFunctionRole.Arn
      Environment:
        Variables:
          S3_BUCKET: !Ref ApprovalBucketName
          S3_BUCKET_KEY: !Ref ApprovalObjectKey
      Code:
        ZipFile: |
          import os
          import boto3
          from botocore.exceptions import ClientError

          def lambda_handler(event, context):
              print(f"Manual approval event: {event}")
              
              if "S3_BUCKET" not in os.environ or "S3_BUCKET_KEY" not in os.environ:
                  print("S3_BUCKET or S3_BUCKET_KEY environment variable not found")
                  return {"hookStatus": "FAILED"}
              
              s3_bucket = os.environ.get("S3_BUCKET")
              my_approval_file = os.environ.get("S3_BUCKET_KEY")            
              approval = check_approval_file(s3_bucket, my_approval_file)

              if approval == "SUCCEEDED":
                  print(f"{my_approval_file} - Approval file found: {approval}")
                  return {"hookStatus": "SUCCEEDED"}
              
              if approval == "FAILED":
                  print(f"{my_approval_file} - Approval file found: {approval}")
                  return {"hookStatus": "FAILED"}
              
              print(f"{my_approval_file} - Approval file not found, waiting for manual approval")
              return {
                  "hookStatus": "IN_PROGRESS",
                  "callBackDelay": 30,
              }

          def check_approval_file(s3_bucket, approval_file):
            """Check S3 for the approval marker; distinguish 'missing' from real errors"""
            print(f"{approval_file} - Checking for approval file: s3://{s3_bucket}/{approval_file}")
            try:
                s3_client = boto3.client("s3")
                obj = s3_client.get_object(Bucket=s3_bucket, Key=approval_file)
                content = obj["Body"].read().decode("utf-8").strip()   # read exactly once
                if content == "approved":
                    print(f"{approval_file} - Check succeeded")
                    return "SUCCEEDED"
                print(f"{approval_file} - Check failed: content={content!r}")
                return "FAILED"
            except ClientError as e:
                code = e.response["Error"]["Code"]
                # Only a genuinely absent object means "keep waiting"
                if code in ("NoSuchKey", "404"):
                    print(f"{approval_file} - Approval file not found yet")
                    return None
                # Permission/config errors must surface, not loop forever
                print(f"{approval_file} - S3 error {code}: {e}")
                return "FAILED"                                         

