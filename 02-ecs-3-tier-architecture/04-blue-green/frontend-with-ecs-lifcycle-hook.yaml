AWSTemplateFormatVersion: "2010-09-09"
Description: "standing up an ECS Express Mode setup"

Parameters:
  ClusterName:
    Type: String
    Default: retail-store-ecs-cluster
    Description: Name of the ECS cluster for Express Mode services.

  UiServiceName:
    Type: String
    Default: ui
    Description: Name of the ECS Express Mode service.

  CatalogServiceName:
    Type: String
    Default: catalog
    Description: Name of the ECS Express Mode catalog service.

  CartServiceName:
    Type: String
    Default: cart
    Description: Name of the ECS Express Mode cart service.

  OrderServiceName:
    Type: String
    Default: order
    Description: Name of the ECS Express Mode order service.

  CheckoutServiceName:
    Type: String
    Default: checkout
    Description: Name of the ECS Express Mode checkout service.

  UiContainerImage:
    Type: String
    Default: public.ecr.aws/aws-containers/retail-store-sample-ui:1.5.0
    Description: Container image for the retail store UI.

  CatalogContainerImage:
    Type: String
    Default: public.ecr.aws/aws-containers/retail-store-sample-catalog:1.5.0
    Description: Container image for the retail store catalog service.

  CartContainerImage:
    Type: String
    Default: public.ecr.aws/aws-containers/retail-store-sample-cart:1.5.0
    Description: Container image for the retail store cart service.

  OrderContainerImage:
    Type: String
    Default: public.ecr.aws/aws-containers/retail-store-sample-orders:1.5.0
    Description: Container image for the retail store order service.

  CheckoutContainerImage:
    Type: String
    Default: public.ecr.aws/aws-containers/retail-store-sample-checkout:1.5.0
    Description: Container image for the retail store checkout service.

  UiContainerPort:
    Type: Number
    Default: 8080
    Description: Port the application listens on.

  CatalogContainerPort:
    Type: Number
    Default: 8080
    Description: Port the application listens on.

  CartContainerPort:
    Type: Number
    Default: 8080
    Description: Port the application listens on.

  OrderContainerPort:
    Type: Number
    Default: 8080
    Description: Port the application listens on.

  CheckoutContainerPort:
    Type: Number
    Default: 8080
    Description: Port the application listens on.

  UiHealthCheckPath:
    Type: String
    Default: /actuator/health
    Description: Health check path exposed by the application. 

  CatalogHealthCheckPath:
    Type: String
    Default: /health
    Description: Health check path exposed by the application. 

  CartHealthCheckPath:
    Type: String
    Default: /actuator/health
    Description: Health check path exposed by the application. 

  OrderHealthCheckPath:
    Type: String
    Default: /actuator/health
    Description: Health check path exposed by the application. 

  CheckoutHealthCheckPath:
    Type: String
    Default: /health
    Description: Health check path exposed by the application. 

  Cpu:
    Type: String
    Default: 2048
    Description: CPU units for the ECS task.

  Mem:
    Type: String
    Default: 4096
    Description: Memory units for the ECS task.

  UiTheme:
    Type: String
    Default: orange
    Description: Theme applied to the retail store UI (RETAIL_UI_THEME).

  ApprovalBucketName:
    Type: String
    Description: Existing S3 bucket that holds the blue/green manual-approval marker object.
    Default: my-ecs-approval-bucket
  ApprovalObjectKey:
    Type: String
    Default: approvals/ui-blue-green.txt
    Description: Object key whose presence approves the production traffic shift.

Resources:

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: retail-store-alb
      Scheme: internet-facing
      Subnets:
        - !ImportValue VpcAPublicSubnetAZ1
        - !ImportValue VpcAPublicSubnetAZ2
      SecurityGroups:
        - !Ref AlbSecurityGroup

#----------------------------------------------------------------
## Modified or new resources for the blue/green deployment setup
#----------------------------------------------------------------
  # modified alb sg
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for the ALB.
      GroupName: retail-store-alb-sg
      VpcId: !ImportValue VpcAId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        # test traffic ingress for blue/green validation
        # use perhaps vpc cidr or specific IP range for testing or aws managed prefix list or onprem cidr
        # This prevents unrestricted access to the test listener from the public internet like below.
        - IpProtocol: tcp        
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0 
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  BlueTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: retail-store-ui-blue-tg
      VpcId: !ImportValue VpcAId
      Port: !Ref UiContainerPort
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: !Ref UiHealthCheckPath
      HealthCheckProtocol: HTTP
      Matcher:
        HttpCode: "200"

  GreenTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: retail-store-ui-green-tg
      VpcId: !ImportValue VpcAId
      Port: !Ref UiContainerPort
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: !Ref UiHealthCheckPath
      HealthCheckProtocol: HTTP
      Matcher:
        HttpCode: "200"

  ProductionListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          ForwardConfig:
            TargetGroups:
              - TargetGroupArn: !Ref BlueTargetGroup
                Weight: 100
              - TargetGroupArn: !Ref GreenTargetGroup
                Weight: 0

  TestListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 8080
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          ForwardConfig:
            TargetGroups:
              - TargetGroupArn: !Ref BlueTargetGroup
                Weight: 100
              - TargetGroupArn: !Ref GreenTargetGroup
                Weight: 0

  ProductionListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref ProductionListener
      Priority: 1
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values: ["/*"]
      Actions:
        - Type: forward
          ForwardConfig:
            TargetGroups:
              - TargetGroupArn: !Ref BlueTargetGroup
                Weight: 100
              - TargetGroupArn: !Ref GreenTargetGroup
                Weight: 0
            TargetGroupStickinessConfig:
              Enabled: true
              DurationSeconds: 5

  TestListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref TestListener
      Priority: 1
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values: ["/*"]
      Actions:
        - Type: forward
          ForwardConfig:
            TargetGroups:
              - TargetGroupArn: !Ref BlueTargetGroup
                Weight: 100
              - TargetGroupArn: !Ref GreenTargetGroup
                Weight: 0
            TargetGroupStickinessConfig:
              Enabled: true
              DurationSeconds: 5

  EcsInfrastructureRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ecsInfrastructureRoleForLoadBalancers
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonECSInfrastructureRolePolicyForLoadBalancers

#----------------------------------------------------------------

#-----------------------------------------------------------------
## Target Group and Listener for UI without blue-green deployment
#-----------------------------------------------------------------

  # UiTargetGroup:
  #   Type: AWS::ElasticLoadBalancingV2::TargetGroup
  #   Properties:
  #     Name: retail-store-ui-tg
  #     VpcId: !ImportValue VpcAId
  #     Port: !Ref UiContainerPort
  #     Protocol: HTTP
  #     TargetType: ip
  #     HealthCheckPath: !Ref UiHealthCheckPath
